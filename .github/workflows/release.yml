name: Release Windows Build

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller PySide6 requests certifi keyring openpyxl

      - name: Set version from tag
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart("v")
          (Get-Content app.py) -replace 'APP_VERSION\s*=\s*".*"', "APP_VERSION = `"$ver`"" | Set-Content app.py
          (Get-Content installer\\ILS_WaterCorp_Invoice_Generator.iss) -replace '#define AppVersion ".*"', "#define AppVersion `"$ver`"" | Set-Content installer\\ILS_WaterCorp_Invoice_Generator.iss

      - name: Build exe (PyInstaller)
        run: |
          $env:PYTHONPATH = "$env:GITHUB_WORKSPACE"
          python -m PyInstaller "ILS Water Corp Invoice Generator.spec"

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\\Inno Setup 6\\ISCC.exe"
          & $iscc "installer\\ILS_WaterCorp_Invoice_Generator.iss"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: "installer/dist/ILS_WaterCorp_Invoice_Generator_Setup.exe"

      - name: Generate latest.json
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart("v")
          $url = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/ILS_WaterCorp_Invoice_Generator_Setup.exe"
          $outDir = "pages\\updates"
          New-Item -ItemType Directory -Path $outDir -Force | Out-Null
          @"
          {
            "version": "$ver",
            "url": "$url",
            "notes": ""
          }
          "@ | Set-Content "$outDir\\latest.json"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages

  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
